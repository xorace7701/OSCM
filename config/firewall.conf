#!/usr/bin/env bash
# ==============================================================================
# OSCM — Open Systems Communications Manager (v1.0)
# Module: Standalone Access Control List (ACL) & Firewall Matrix [MODULAR]
# Target: Executed by installer or reloaded standalone to tune appliance ports
# ==============================================================================

# Flush existing rule structures to prevent chains from stacking up errors
iptables -F
iptables -X

# --- Default Policy Boundaries ---
# Drop all incoming external traffic, allow all outbound traffic, allow loopback
iptables -P INPUT DROP
iptables -P FORWARD DROP
iptables -P OUTPUT ALLOW
iptables -A INPUT -i lo -j ACCEPT
iptables -A INPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT

# ==============================================================================
# AUTHORIZED ADMINISTRATIVE & PROVISIONING SERVICES MATRIX (UDP & TCP)
# ==============================================================================

# 1. Web UI & Asset Distribution Ports (Flask, Nginx Reverse Proxy)
iptables -A INPUT -p tcp --dport 80 -j ACCEPT      # HTTP Provisioning
iptables -A INPUT -p tcp --dport 443 -j ACCEPT     # HTTPS Secure Assets
iptables -A INPUT -p tcp --dport 5000 -j ACCEPT    # Flask Core Panel
iptables -A INPUT -p tcp --dport 8080 -j ACCEPT    # Nginx Global Socket
iptables -A INPUT -p tcp --dport 8081 -j ACCEPT    # MJPEG Camera Streams

# 2. File Bootstrapping & Sync Subsystems (TFTP & FTP)
iptables -A INPUT -p udp --dport 69 -j ACCEPT      # TFTP Bootstrap Engine
iptables -A INPUT -p tcp --dport 21 -j ACCEPT      # FTP Core Upload Port
iptables -A INPUT -p tcp --dport 20 -j ACCEPT      # FTP Data Channel

# 3. Dynamic Local Core Network Infrastructure (DHCP & NTP)
iptables -A INPUT -p udp --dport 67:68 -j ACCEPT   # DHCP Lease Allocations
iptables -A INPUT -p udp --dport 123 -j ACCEPT     # NTP System Clock Syncs

# ==============================================================================
# TELEPHONY Core SIGNALING & AUDIO STREAM CHANNELS
# ==============================================================================
iptables -A INPUT -p udp --dport 5060 -j ACCEPT    # SIP Signaling Core
iptables -A INPUT -p tcp --dport 5060 -j ACCEPT    # SIP TCP Signaling Failover
iptables -A INPUT -p udp --dport 10000:20000 -j ACCEPT # RTP Crisp Voice Streams

# Optional: Drop an open hole for local secure administration access
iptables -A INPUT -p tcp --dport 22 -j ACCEPT      # SSH Terminal Port

echo -e "\033[1;32m   [+] OSCM Modular Access Control Firewall Applied Successfully!\033[0m"
