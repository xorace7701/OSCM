#!/usr/bin/env bash
# ==============================================================================
# OSCM — Open Systems Communications Manager (v1.0)
# Module: Interactive Network Selector & Legacy ifupdown Compiler [PRODUCTION]
# Target: /etc/network/interfaces (Compiled interactively at install time)
# ==============================================================================
set -e

BLUE="\033[1;36m"; GREEN="\033[1;32m"; YELLOW="\033[1;33m"; RED="\033[1;31m"; RESET="\033[0m"
TARGET_FILE="/etc/network/interfaces"

echo -e "${BLUE}====================================================================${RESET}"
echo -e "       OSCM — PRODUCTION NETWORK INTERFACE COMPILER                 ${RESET}"
echo -e "${BLUE}====================================================================${RESET}"

echo -e "${YELLOW}[+] Neutralizing Netplan abstraction layers...${RESET}"
apt-get purge -y netplan.io || true
rm -rf /etc/netplan/
apt-get install -y ifupdown vlan
modprobe 8021q && echo "8021q" >> /etc/modules || true

echo -e "\n${YELLOW}Select your system's hardware network architecture:${RESET}"
echo -e "  ${GREEN}1. Single-NIC Mode${RESET}      (Virtual VLAN tagging on a single adapter)"
echo -e "  ${GREEN}2. Multi-NIC Mode${RESET}       (Distinct flat physical server ports, no tags)"
echo -e "  ${GREEN}3. Production Hybrid Mode${RESET} (Management on eth0, Data/Voice on 10G SFP+ Trunk)"
echo -e "  ${GREEN}4. Advanced Custom Mode${RESET}  (Define any combination of ports and custom VLAN tags)"
echo -e "${BLUE}--------------------------------------------------------------------${RESET}"
read -p "Enter architecture choice [1-4]: " NET_CHOICE

echo -e "# Dynamic configuration generated by OSCM Selector\nauto lo\niface lo inet loopback\n" > $TARGET_FILE

# ------------------------------------------------------------------------------
# OPTION 1: PRESERVED SINGLE-NIC MODE
# ------------------------------------------------------------------------------
if [ "$NET_CHOICE" -eq 1 ]; then
    echo -e "\n${BLUE}--- Single-NIC Configuration Setup ---${RESET}"
    read -p "Enter primary physical network adapter name (e.g., enp0s31f6): " RAW_NIC
    read -p "Enter host management IP address (e.g., 10.1.0.40): " MGMT_IP
    read -p "Enter network gateway IP address (e.g., 10.1.0.1): " MGMT_GW
    read -p "Enter Data VLAN gateway IP address (e.g., 10.2.0.1): " DATA_GW
    read -p "Enter Voice VLAN gateway IP address (e.g., 10.100.0.1): " VOICE_GW

    cat << EOF >> $TARGET_FILE
# --- Native Management Segment ---
auto $RAW_NIC
iface $RAW_NIC inet static
    address $MGMT_IP
    netmask 255.255.255.0
    gateway $MGMT_GW
    dns-nameservers $MGMT_GW 1.1.1.1

# --- Data Segregation Sub-Interface (VLAN 2) ---
auto $RAW_NIC.2
iface $RAW_NIC.2 inet static
    address $DATA_GW
    netmask 255.255.255.0
    vlan-raw-device $RAW_NIC

# --- Voice Segregation Sub-Interface (VLAN 100) ---
auto $RAW_NIC.100
iface $RAW_NIC.100 inet static
    address $VOICE_GW
    netmask 255.255.255.0
    vlan-raw-device $RAW_NIC
EOF

# ------------------------------------------------------------------------------
# OPTION 2: PRESERVED MULTI-NIC MODE
# ------------------------------------------------------------------------------
elif [ "$NET_CHOICE" -eq 2 ]; then
    echo -e "\n${BLUE}--- Multi-NIC Configuration Setup ---${RESET}"
    read -p "Enter Management NIC interface name (VLAN 1 / Admin Port): " MGMT_NIC
    read -p "Enter core management IP address (e.g., 10.1.0.40): " MGMT_IP
    read -p "Enter network gateway IP address (e.g., 10.1.0.1): " MGMT_GW
    read -p "Enter Data Infrastructure NIC interface name (VLAN 2): " DATA_NIC
    read -p "Enter Data gateway IP address (e.g., 10.2.0.1): " DATA_GW
    read -p "Enter Voice Endpoint NIC interface name (VLAN 100): " VOICE_NIC
    read -p "Enter Voice gateway IP address (e.g., 10.100.0.1): " VOICE_GW

    cat << EOF >> $TARGET_FILE
# --- Dedicated Management Adapter ---
auto $MGMT_NIC
iface $MGMT_NIC inet static
    address $MGMT_IP
    netmask 255.255.255.0
    gateway $MGMT_GW
    dns-nameservers $MGMT_GW 1.1.1.1

# --- Dedicated Data Infrastructure Adapter ---
auto $DATA_NIC
iface $DATA_NIC inet static
    address $DATA_GW
    netmask 255.255.255.0

# --- Dedicated Voice Endpoint Signaling Adapter ---
auto $VOICE_NIC
iface $VOICE_NIC inet static
    address $VOICE_GW
    netmask 255.255.255.0
EOF

# ------------------------------------------------------------------------------
# OPTION 3: PRODUCTION HYBRID MODE (OPTIPLEX 5040 DUAL 10G TARGET)
# ------------------------------------------------------------------------------
elif [ "$NET_CHOICE" -eq 3 ]; then
    echo -e "\n${BLUE}--- Production Hybrid 10G Trunk Setup ---${RESET}"
    read -p "Enter WAN/Management Interface (e.g., eth0): " WAN_NIC
    read -p "Enter WAN IP Address (e.g., 10.1.0.40): " WAN_IP
    read -p "Enter WAN Network Gateway IP (e.g., 10.1.0.1): " WAN_GW
    read -p "Enter High-Speed Fiber Trunk Interface (e.g., eth3): " TRUNK_NIC
    read -p "Enter Data Infrastructure IP (VLAN 2 - e.g., 10.2.0.1): " DATA_IP
    read -p "Enter Voice Endpoint PBX IP (VLAN 100 - e.g., 10.100.0.1): " VOICE_IP

    cat << EOF >> $TARGET_FILE
# --- Dedicated Native WAN / Management (VLAN 1 Context) ---
auto $WAN_NIC
iface $WAN_NIC inet static
    address $WAN_IP
    netmask 255.255.255.0
    gateway $WAN_GW
    dns-nameservers $WAN_GW 1.1.1.1

# --- Physical Fiber SFP+ Base Adapter (Forced Up for Driver Link Sync) ---
auto $TRUNK_NIC
iface $TRUNK_NIC inet manual
    up ip link set dev \$IFACE up
    down ip link set dev \$IFACE down

# --- Data Infrastructure Sub-Interface (VLAN 2) ---
auto $TRUNK_NIC.2
iface $TRUNK_NIC.2 inet static
    address $DATA_IP
    netmask 255.255.255.0
    vlan-raw-device $TRUNK_NIC

# --- Voice Endpoint PBX Signaling Interface (VLAN 100) ---
auto $TRUNK_NIC.100
iface $TRUNK_NIC.100 inet static
    address $VOICE_IP
    netmask 255.255.255.0
    vlan-raw-device $TRUNK_NIC
EOF

# ------------------------------------------------------------------------------
# OPTION 4: ADVANCED ADVANCED CUSTOM FIELD MODE
# ------------------------------------------------------------------------------
elif [ "$NET_CHOICE" -eq 4 ]; then
    echo -e "\n${BLUE}--- Advanced Custom Configuration Setup ---${RESET}"
    
    # Track physical parent adapters we need to flag as 'inet manual' awake hooks
    declare -A UNIQUE_PARENTS

    # --- SEGMENT 1: MANAGEMENT ---
    read -p "Enter Management physical NIC name (e.g., eth0): " M_NIC
    read -p "Is Management tagged over a VLAN? [y/N]: " M_TAGGED
    M_FINAL_NAME=$M_NIC
    if [[ "$M_TAGGED" =~ ^[Yy]$ ]]; then
        read -p "Enter Management VLAN ID (e.g., 10): " M_VID
        M_FINAL_NAME="$M_NIC.$M_VID"
        UNIQUE_PARENTS["$M_NIC"]=1
    fi
    read -p "Enter Management static IP: " M_IP
    read -p "Enter Default Gateway IP: " M_GW
    
    # --- SEGMENT 2: DATA ---
    read -p "Enter Data Infrastructure physical NIC name: " D_NIC
    read -p "Is Data tagged over a VLAN? [y/N]: " D_TAGGED
    D_FINAL_NAME=$D_NIC
    if [[ "$D_TAGGED" =~ ^[Yy]$ ]]; then
        read -p "Enter Data VLAN ID (e.g., 2): " D_VID
        D_FINAL_NAME="$D_NIC.$D_VID"
        UNIQUE_PARENTS["$D_NIC"]=1
    fi
    read -p "Enter Data IP address: " D_IP

    # --- SEGMENT 3: VOICE ---
    read -p "Enter Voice PBX physical NIC name: " V_NIC
    read -p "Is Voice tagged over a VLAN? [y/N]: " V_TAGGED
    V_FINAL_NAME=$V_NIC
    if [[ "$V_TAGGED" =~ ^[Yy]$ ]]; then
        read -p "Enter Voice VLAN ID (e.g., 100): " V_VID
        V_FINAL_NAME="$V_NIC.$V_VID"
        UNIQUE_PARENTS["$V_NIC"]=1
    fi
    read -p "Enter Voice PBX IP address: " V_IP

    # Write out raw interfaces that have sub-VLANs to ensure they initialize link state
    for PARENT_CARD in "${!UNIQUE_PARENTS[@]}"; do
        cat << EOF >> $TARGET_FILE
# --- Hardware Initialization for Parent Port ---
auto $PARENT_CARD
iface $PARENT_CARD inet manual
    up ip link set dev \$IFACE up
    down ip link set dev \$IFACE down

EOF
    done

    # Output dynamic entries based on choices
    cat << EOF >> $TARGET_FILE
# --- Custom Management Layout ---
auto $M_FINAL_NAME
iface $M_FINAL_NAME inet static
    address $M_IP
    netmask 255.255.255.0
    gateway $M_GW
    dns-nameservers $M_GW 1.1.1.1
EOF

    if [[ "$M_TAGGED" =~ ^[Yy]$ ]]; then echo "    vlan-raw-device $M_NIC" >> $TARGET_FILE; fi

    cat << EOF >> $TARGET_FILE

# --- Custom Data Infrastructure Layout ---
auto $D_FINAL_NAME
iface $D_FINAL_NAME inet static
    address $D_IP
    netmask 255.255.255.0
EOF
    if [[ "$D_TAGGED" =~ ^[Yy]$ ]]; then echo "    vlan-raw-device $D_NIC" >> $TARGET_FILE; fi

    cat << EOF >> $TARGET_FILE

# --- Custom Voice Endpoint Layout ---
auto $V_FINAL_NAME
iface $V_FINAL_NAME inet static
    address $V_IP
    netmask 255.255.255.0
EOF
    if [[ "$V_TAGGED" =~ ^[Yy]$ ]]; then echo "    vlan-raw-device $V_NIC" >> $TARGET_FILE; fi

else
    echo -e "${RED}❌ Selection error. Network compiler aborted without writing modifications.${RESET}"
    exit 1
fi

echo -e "\n${GREEN}✔️ Networking matrix written successfully into $TARGET_FILE!${RESET}"
