; ====================================================================
;               OSCM — Sovereign Telephony Core Routing Engine
;                       Universal Dialplan Framework v1.0
; ====================================================================

[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]
; Universal network telemetry tracking variables
OSCM_INTERCOM_GROUP=Multicast

[oscm-default-context]
; 1. Local Subscriber Extension Routing Loop (Extensions 100 to 899)
exten => _[1-8]xx,1,NoOp(OSCM Inbound Call Delivery Target: ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},20)
 same => n,GotoIf($["${DIALSTATUS}" = "BUSY"]?voicemail-busy:voicemail-noans)
 same => n(voicemail-busy),VoiceMail(${EXTEN}@oscm-voicemail-bank,b)
 same => n,Hangup()
 same => n(voicemail-noans),VoiceMail(${EXTEN}@oscm-voicemail-bank,u)
 same => n,Hangup()

; 2. Native System Voicemail Management Box Portal (Dialing *98)
exten => *98,1,NoOp(OSCM Subscriber Accessing System Voicemail Center)
 same => n,Answer()
 same => n,VoiceMailMain(@oscm-voicemail-bank)
 same => n,Hangup()

; 3. Network-Wide Zero-Server Multicast Intercom Paging (Dialing 900)
exten => 900,1,NoOp(OSCM Broadcast Layer Initiating Intercom Matrix)
 same => n,Answer()
 same => n,Playback(beep) ; Inject warning audio alert pulse to target array
 same => n,PJSIPBroadCast(SIPNotify,Event=multicast-page)
 same => n,Hangup()

; ====================================================================
;               OSCM Centralized Voicemail Box Registries
; ====================================================================
[oscm-voicemail-bank]
; Formats layout template: pin => Subscriber Name, Email, Options
101 => 1234,OSCM Terminal Asset 101,,tz=central|attach=no
102 => 1234,OSCM Terminal Asset 102,,tz=central|attach=no
103 => 1234,OSCM Terminal Asset 103,,tz=central|attach=no
