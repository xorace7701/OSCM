; ====================================================================
;               OSCM — Sovereign Telephony Core Driver
;             Universal SIP Engine Profile v1.1 - Hardened
; ====================================================================

[global]
type=global
user_agent=OSCM-Sovereign-Appliance-v1.0

[system]
type=system

; ====================================================================
; MODULE TRANSPORTS - Binds Engine onto standard SIP Network Signaling
; ====================================================================
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060 ; Listens globally on all local NIC interfaces and inbound VPNs

; ====================================================================
; ARCHITECTURE TEMPLATES - Reusable configuration blueprints
; ====================================================================
[endpoint-template](!)
type=endpoint
context=oscm-default-context
disallow=all
allow=ulaw,alaw ; Forces clean 8000Hz mu-law telephony voice streams
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
direct_media=no

[auth-template](!)
type=auth
auth_type=md5

[aor-template](!)
type=aor
max_contacts=1
remove_existing=yes

; ====================================================================
; AUTOMATED USER STAGING BOUNDARY - PARSED BY OSCM GENERATOR ENGINE
; ====================================================================
; Dynamic allocations are appended cleanly beneath this delimiter line.
; Template structure used by compiler engine:
;
; [@@EXT@@](endpoint-template)
; auth=auth@@EXT@@
; aors=@@EXT@@
; mailboxes=@@EXT@@@oscm-voicemail-bank
;
; [auth@@EXT@@](auth-template)
; username=@@EXT@@
; password=@@SECRET_PASS@@
;
; [@@EXT@@](aor-template)
; ====================================================================

; --- SEEDED SUBSCRIBER ASSET 101 ---
[101](endpoint-template)
auth=auth101
aors=101
mailboxes=101@oscm-voicemail-bank

[auth101](auth-template)
username=101
password=oscm_secure_local_pass

[101](aor-template)

; --- SEEDED SUBSCRIBER ASSET 102 ---
[102](endpoint-template)
auth=auth102
aors=102
mailboxes=102@oscm-voicemail-bank

[auth102](auth-template)
username=102
password=oscm_secure_local_pass

[102](aor-template)
