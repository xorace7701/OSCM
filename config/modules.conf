; ====================================================================
;               OSCM — Minimalist SIP Module Loader Profile
; ====================================================================
[modules]
autoload=yes

; Pre-emptively block legacy channel drivers we are bypassing
noload => chan_sip.so
noload => chan_alsa.so
noload => chan_console.so

; Explicitly require our modern sovereign infrastructure layers
load => res_pjsip.so
load => res_pjsip_session.so
load => chan_pjsip.so
load => app_voicemail.so
load => app_dial.so
