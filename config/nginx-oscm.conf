# ==============================================================================
# OSCM — Open Systems Communications Manager (v1.0)
# Module: Unified Multi-NIC Web & Asset Distribution Matrix [TEMPLATE]
# Target: /etc/nginx/sites-available/oscm.conf
# ==============================================================================

# ==============================================================================
# SECTION 1: GLOBAL SERVICES MATRIX (Ports 80, 8080, and 5000 Accessible Everywhere)
# ==============================================================================
server {
    # Listen on all operational interfaces globally (Management, Data, and Voice)
    listen 80;
    listen 443 ssl;
    listen 8080;
    listen 5000;
    
    # Dual-stack IPv6 compatibility across identical bounds
    listen [::]:80;
    listen [::]:443 ssl;
    listen [::]:8080;
    listen [::]:5000;

    ssl_certificate /etc/ssl/certs/ssl-cert-snakeoil.pem;
    ssl_certificate_key /etc/ssl/private/ssl-cert-snakeoil.key;
    
    server_name _;
    root /var/www/oscm;
    index index.html;
    
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # 1. DYNAMIC WEB CONSOLE PANEL REVERSE PROXY
    # Globally mapped to ensure background diagnostic tasks communicate seamlessly
    location /dashboard/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. AUDIO ENGINE PIPELINE (Mono 8000Hz 8-Bit Mu-Law Ringtones)
    location /ringtones/ {
        alias /var/www/oscm/apps/ringtones/;
        autoindex on;
        expires 7d;
        add_header Content-Type "audio/basic";
    }

    # 3. SURVEILLANCE MJPEG VIDEO PROXY HANDSHAKE
    location /camera/stream {
        proxy_pass http://127.0.0.1:8081;
        proxy_buffering off;
        proxy_read_timeout 24h;
        proxy_set_header Cache-Control "no-cache";
        proxy_set_header Connection "keep-alive";
    }

    # Fallback default location block
    location / {
        try_files $uri $uri/ =404;
    }
}

# ==============================================================================
# SECTION 2: MANAGEMENT PORTAL & VPN TERMINATION ASSETS (VLAN 1)
# ==============================================================================
server {
    listen @@APPLIANCE_IP@@:80;
    listen @@APPLIANCE_IP@@:443 ssl;
    server_name mgmt.oscm.local;

    # Local storage for provisioning files queried by remote VPN endpoints
    location / {
        root /var/www/oscm/tftpboot;
        autoindex on;
    }
}

# ==============================================================================
# SECTION 3: DATA VLAN CONFIGURATION & ASSET HUB (VLAN 2)
# ==============================================================================
server {
    listen @@DATA_GATEWAY_IP@@:80;
    listen @@DATA_GATEWAY_IP@@:443 ssl;
    server_name data-provisioning.oscm.local;

    # Dedicated space for managed network switch configs, maps, and images
    location / {
        root /var/www/oscm/tftpboot/switch_assets;
        autoindex off; # Obfuscate switch system files from simple network sniffs
        expires 1h;
    }
}

# ==============================================================================
# SECTION 4: VOICE VLAN VOIP ENDPOINT BOOTSTRAPPER (VLAN 100)
# ==============================================================================
server {
    listen @@VOICE_GATEWAY_IP@@:80;
    listen @@VOICE_GATEWAY_IP@@:443 ssl;
    server_name voice-provisioning.oscm.local;

    # Dedicated root folder strictly serving IP Phone XML profiles and base configurations
    location / {
        root /var/www/oscm/tftpboot/phone_assets;
        autoindex on; # Left active to support older legacy phone TFTP/HTTP failover loops
        expires 5m;
    }

    # 5. LIVE XML PHONEBOOK UNIFIED DIRECTORY (Isolated solely to the active Phone VLAN)
    location /directory/ {
        alias /var/www/oscm/apps/directory/;
        autoindex off;
        expires 15m;
        add_header Content-Type "text/xml; charset=utf-8";
    }

    # 6. PHONE BACKGROUND IMAGES
    location /background_images/ {
        alias /var/www/oscm/apps/background_images/;
        autoindex on;
        expires 1d;
    }
}
