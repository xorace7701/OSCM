# ==============================================================================
# OSCM Open Systems Communications Manager (v1.0)
# Module: Zero-Touch Provisioning (ZTP) Network Core Engine [TEMPLATE]
# Target: /etc/dnsmasq.conf (Compiled at install time based on hardware profile)
# ==============================================================================

# --- Interface & Adapter Bindings ---
# Supports either a single VLAN-tagged interface or distinct physical NICs
interface=@@MGMT_INTERFACE@@
interface=@@DATA_INTERFACE@@
interface=@@VOICE_INTERFACE@@
bind-interfaces

# --- DNS Layer Protections & Intercepts ---
domain-needed
bogus-priv
no-resolv
no-poll
domain=@@OSCM_DOMAIN@@
local=/@@OSCM_DOMAIN@@/

# --- NTP Time Server Engine (Global Authorization) ---
# Directs walled-off devices on Data/Voice layers to sync clocks with this host
dhcp-option=option:ntp-server,0.0.0.0

# --- Native Management Segment (Home Network & Inbound VPN) ---
# Serves the primary system management and remote admin traffic
dhcp-range=set:mgmt_lan,@@MGMT_POOL_START@@,@@MGMT_POOL_END@@,@@MGMT_NETMASK@@,12h
dhcp-option=tag:mgmt_lan,option:router,@@MGMT_GATEWAY@@
dhcp-option=tag:mgmt_lan,option:dns-server,@@APPLIANCE_IP@@,1.1.1.1
dhcp-option=tag:mgmt_lan,option:domain-name,"home.@@OSCM_DOMAIN@@"

# --- Data Network Segment (Walled Off - Local Web/Time Access Only) ---
dhcp-range=set:data_lan,@@DATA_POOL_START@@,@@DATA_POOL_END@@,@@DATA_NETMASK@@,8h
dhcp-option=tag:data_lan,option:router,@@DATA_GATEWAY@@
dhcp-option=tag:data_lan,option:dns-server,@@APPLIANCE_IP@@
dhcp-option=tag:data_lan,option:domain-name,"data.@@OSCM_DOMAIN@@"

# --- Voice Network Segment (Walled Off - Pure VoIP Stream Only) ---
dhcp-range=set:voice_ztp,@@VOICE_POOL_START@@,@@VOICE_POOL_END@@,@@VOICE_NETMASK@@,2h
dhcp-option=tag:voice_ztp,option:router,@@VOICE_GATEWAY@@
dhcp-option=tag:voice_ztp,option:dns-server,@@APPLIANCE_IP@@
dhcp-option=tag:voice_ztp,option:domain-name,"ztp.@@OSCM_DOMAIN@@"

# --- ZTP Provisioning Options (Option 66 String & Option 150 Array) ---
# Dynamically points hardware straight to the local asset server configuration
dhcp-option=tag:data_lan,66,"http://@@APPLIANCE_IP@@/provisioning/"
dhcp-option=tag:voice_ztp,66,"http://@@APPLIANCE_IP@@/provisioning/"
dhcp-option=150,@@APPLIANCE_IP@@

# --- Integrated TFTP Sub-Engine ---
enable-tftp
tftp-root=/var/www/oscm/tftpboot
tftp-no-fail

# --- Logging & Diagnostic Handlers ---
log-dhcp
log-queries
log-facility=/var/log/dnsmasq.log
dhcp-leasefile=/var/lib/misc/dnsmasq.leases

# --- OSCM Dynamic Automation Hook ---
dhcp-script=/etc/oscm/oscm_generator.py
